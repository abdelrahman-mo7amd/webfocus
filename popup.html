<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFocus</title>
    <link rel="stylesheet" href="popup.css">
    <link
    rel="stylesheet"
    href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
</head>
<body>
    <div class="popup-container">

        <header class="header">
            <div class="brand">
                <div class="logo">
                    <i class="fa-brands fa-safari"></i>
                </div>

                <div>
                    <h1>WebFocus</h1>
                    <span>I am here to help you focused &lt;3</span>
                </div>
            </div>
        </header>

        <main class="content">
            <section class="total-card">
                <div class="total-label">Today's screen time</div>

                <div class="total-time" id="totalTime">
                    0m
                </div>

                <div class="total-subtitle">
                    Across all websites, remember your goal
                </div>
            </section>

            <div class="category-section">
                <div class="section-header category-toggle" id="categoryToggle">
                    <div class="section-title">
                        Categories
                    </div>

                    <div class="category-arrow" id="categoryArrow">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="categories" id="categories"></div>
            </div>

            <div class="section-header websites-header">
                <div class="section-title">
                    Websites
                </div>
                <div class="site-count" id="siteCount">
                    0 sites
                </div>
            </div>

            <div class="sites" id="sites">
                <div class="empty">
                    <div class="empty-icon">-</div>
                    <h3>No activity yet</h3>
                    <p>
                        Start browsing and i am here to track
                        your time broooo!
                    </p>
                </div>
            </div>
            <div class="footer">
                WebFocus | Stay Focused, I am here to that goal &lt;3
            </div>
        </main>
    </div>

    <script src="categories.js"></script>
    <script src="popup.js"></script>
</body>
</html>
